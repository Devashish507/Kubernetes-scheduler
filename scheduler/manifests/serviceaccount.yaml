---
# =============================================================================
# scheduler/manifests/serviceaccount.yaml
# =============================================================================
# A dedicated ServiceAccount for the energy-aware-scheduler.
# This is intentionally separate from the default scheduler's ServiceAccount
# so that permissions are scoped and auditable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: energy-aware-scheduler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: energy-aware-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: energy-project
