apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario1-energy-aware
  namespace: default
  labels:
    app: scenario1-energy-aware
    energy.project/scenario: scenario1
    energy.project/scheduler: energy-aware-scheduler
    energy.project/workload-type: latency-sensitive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scenario1-energy-aware
  template:
    metadata:
      labels:
        app: scenario1-energy-aware
        energy.project/scenario: scenario1
        energy.project/scheduler: energy-aware-scheduler
        energy.project/workload-type: latency-sensitive
      annotations:
        energy.project/workload-type: latency-sensitive
    spec:
      schedulerName: energy-aware-scheduler
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
