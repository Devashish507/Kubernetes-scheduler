# =============================================================================
# monitoring/values.yaml
# =============================================================================
# Project-specific Helm values for kube-prometheus-stack.
#
# Chart:   prometheus-community/kube-prometheus-stack
# Version: 91.5.2  (verified on Artifact Hub as of September 2026)
#
# Install command (run from project root):
#   helm upgrade --install kube-prometheus-stack \
#     prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --create-namespace \
#     --version 91.5.2 \
#     --values monitoring/values.yaml \
#     --wait --timeout 10m
#
# Design decisions:
# -----------------
# 1. serviceMonitorSelectorNilUsesHelmValues: false
#    By default the Prometheus Operator only discovers ServiceMonitors that
#    carry the Helm release label.  Setting this to false allows Prometheus
#    to discover ALL ServiceMonitors in the cluster, regardless of which
#    chart created them.  This is required so that ServiceMonitors deployed
#    by the scheduler, Kepler, or any other workload are scraped
#    automatically without needing manual label patching.
#    See: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/README.md
#
# 2. podMonitorSelectorNilUsesHelmValues: false
#    Same rationale as above, but for PodMonitors.
#
# 3. ruleSelectorNilUsesHelmValues: false
#    Same rationale, but for PrometheusRules.
#
# 4. Grafana is enabled with default settings.
#    The admin password is auto-generated by Helm and stored in the secret:
#      kube-prometheus-stack-grafana  (key: admin-password)
#    Retrieve with: kubectl get secret kube-prometheus-stack-grafana \
#                     -n monitoring \
#                     -o jsonpath="{.data.admin-password}" | base64 --decode
#
# 5. Resources are left at chart defaults to avoid OOM issues on KIND.
#    KIND nodes share the host machine's resources; do not set high limits.
# =============================================================================

# ---------------------------------------------------------------------------
# Prometheus Operator configuration
# ---------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Allow Prometheus to discover ServiceMonitors from ALL namespaces,
    # not just those labelled with this Helm release.
    # Required for future Kepler and scheduler ServiceMonitors.
    serviceMonitorSelectorNilUsesHelmValues: false

    # Allow Prometheus to discover PodMonitors from all namespaces.
    podMonitorSelectorNilUsesHelmValues: false

    # Allow Prometheus to pick up PrometheusRules from all namespaces.
    ruleSelectorNilUsesHelmValues: false

    # Retain 5 days of data (sufficient for a B.Tech experiment).
    retention: 5d

# ---------------------------------------------------------------------------
# Grafana configuration
# ---------------------------------------------------------------------------
grafana:
  # Grafana is enabled by default in the chart.
  enabled: true

  # The admin username.  Password is auto-generated by Helm and stored in
  # the Kubernetes secret 'kube-prometheus-stack-grafana'.
  # To retrieve: kubectl get secret kube-prometheus-stack-grafana \
  #                -n monitoring \
  #                -o jsonpath="{.data.admin-password}" | base64 --decode
  adminUser: admin

  # Use the Grafana default dashboards provided by the chart.
  defaultDashboardsEnabled: true

  # Enable the sidecar that watches for ConfigMaps labelled
  # grafana_dashboard=1 and auto-provisions them as dashboards.
  # This is the canonical pattern documented by kube-prometheus-stack.
  sidecar:
    dashboards:
      enabled: true
      # Label that the sidecar uses to discover dashboard ConfigMaps.
      label: grafana_dashboard
      labelValue: "1"
      # Search all namespaces, not just the release namespace.
      searchNamespace: ALL
      # Allow dashboards to specify their folder.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

# ---------------------------------------------------------------------------
# AlertManager
# ---------------------------------------------------------------------------
alertmanager:
  # Keep AlertManager enabled (chart default) but do not configure routes
  # for Week 1.  Can be customised later.
  enabled: true
